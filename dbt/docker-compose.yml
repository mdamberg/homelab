services:
  postgres:
    image: postgres:16-alpine
    container_name: home-metrics-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - home-metrics
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  dbt-runner:
    build:
      context: ./dbt-runner
    container_name: home-metrics-dbt-runner
    restart: unless-stopped
    init: true
    working_dir: /usr/app/dbt
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DBT_PROFILES_DIR: /root/.dbt
      HC_DBT_REGULAR: ${HC_DBT_REGULAR:-}
      HC_DBT_REFRESH: ${HC_DBT_REFRESH:-}
    volumes:
      - ./home_metrics_dbt:/usr/app/dbt
      - ./profiles:/root/.dbt:ro
      - ./cron/dbt-schedule:/etc/supercronic/dbt-schedule:ro
    networks:
      - home-metrics
    depends_on:
      postgres:
        condition: service_healthy
    command: ["supercronic", "/etc/supercronic/dbt-schedule"]

networks:
  home-metrics:
    name: home-metrics
    driver: bridge

volumes:
  postgres_data:
