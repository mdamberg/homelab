version: 2

models:
  - name: dim_media_entities
    description: "Dimension table for media entities"
    columns:
      - name: dbt_scd_id
        description: "Unique id for each version of each media entity"
        tests:
          - unique
          - not_null
        config:
          meta:
            dimension:
              type: string
      - name: media_key
        description: "Surrogate key for the media entity (source + title); repeats across versions"
        tests:
          - not_null
        config:
          meta:
            dimension:
              type: string
      - name: source
        description: "Source of the media entity (e.g., Sonarr, Radarr)"
        config:
          meta:
            dimension:
              type: string
      - name: media_type
        description: "Type of media entity (e.g., movie, show, album)"
        config:
          meta:
            dimension:
              type: string
      - name: library_name
        description: "Name of the media library"
        config:
          meta:
            dimension:
              type: string
