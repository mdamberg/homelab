models:
  - name: intmdt_simplefin_balances
    description: "SimpleFIN balance snapshots joined to normalized account names; 1 row per account per bank refresh"
    meta:
      hidden: true
    columns:
      - name: balance_skey
        description: "Surrogate key from account_id + the raw balance_date timestamp (balance_datetime)"
        tests:
          - unique
          - not_null
        config:
          meta:
            dimension:
              type: string
      - name: balance_date
        description: "Date (UTC) the bank last updated this balance; not the date the job ran"
        config:
          meta:
            dimension:
              type: date
      - name: balance_datetime
        description: "Timestamp (UTC) the bank last updated this balance; not the time the job ran"
        tests:
          - not_null
        config:
          meta:
            dimension:
              type: timestamp
      - name: account_id
        description: "SimpleFIN account identifier (opaque Bridge id, not the bank account number)"
        tests:
          - not_null
        config:
          meta:
            dimension:
              type: string
      - name: account_name
        description: "Clean account name from map_financial_accounts"
        tests:
          - not_null
        config:
          meta:
            dimension:
              type: string
      - name: conn_id
        description: "SimpleFIN connection id the account belongs to"
        config:
          meta:
            dimension:
              type: string
      - name: institution_name
        description: "Bank the account belongs to (e.g. Wells Fargo)"
        config:
          meta:
            dimension:
              type: string
      - name: currency
        description: "ISO 4217 currency code of the balances (e.g. USD)"
        config:
          meta:
            dimension:
              type: string
      - name: balance
        description: "Ledger balance as of balance_datetime"
        tests:
          - not_null
        config:
          meta:
            dimension:
              type: number
      - name: available_balance
        description: "Available balance as of balance_datetime; null when SimpleFIN omits it because it equals balance"
        config:
          meta:
            dimension:
              type: number
      - name: holdings
        description: "Investment holdings from the payload as JSON text; an empty array ([]) for bank and card accounts"
        config:
          meta:
            dimension:
              type: string
