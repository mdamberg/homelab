models:
  - name: intmdt_teller_accounts
    description: "Enriched accounts with holder mapping, friendly names, and surrogate keys. Filters to open accounts only."
    meta:
      hidden: true
    columns:
      - name: account_pk
        description: "Primary key from raw accounts table"
        tests:
          - unique
          - not_null
        config:
          meta:
            dimension:
              type: number
      - name: account_key
        description: "Surrogate key based on teller_account_id"
        tests:
          - unique
          - not_null
        config:
          meta:
            dimension:
              type: string
      - name: teller_account_id
        description: "Teller's unique account identifier"
        tests:
          - unique
          - not_null
        config:
          meta:
            dimension:
              type: string
      - name: account_holder
        description: "Derived account holder name (Matt, Jessica, or Unknown)"
        tests:
          - not_null
        config:
          meta:
            dimension:
              type: string
      - name: account_holder_key
        description: "Surrogate key based on account_holder"
        tests:
          - not_null
        config:
          meta:
            dimension:
              type: string
      - name: account_name_friendly
        description: "Human-readable account name (e.g. Matt Checking, Jessica WF Credit Card)"
        config:
          meta:
            dimension:
              type: string
      - name: enrollment_id
        description: "Teller enrollment identifier"
        config:
          meta:
            dimension:
              type: string
      - name: institution_name
        description: "Name of the financial institution"
        config:
          meta:
            dimension:
              type: string
      - name: institution_id
        description: "Teller's institution identifier"
        config:
          meta:
            dimension:
              type: string
      - name: account_name
        description: "Raw account name from Teller"
        config:
          meta:
            dimension:
              type: string
      - name: account_type
        description: "Account type (checking, savings, credit)"
        config:
          meta:
            dimension:
              type: string
      - name: account_subtype
        description: "Teller account subtype"
        config:
          meta:
            dimension:
              type: string
      - name: account_status
        description: "Account connection status (will always be open due to filter)"
        config:
          meta:
            dimension:
              type: string
      - name: currency
        description: "Currency code (USD)"
        config:
          meta:
            dimension:
              type: string
      - name: last_four
        description: "Last four digits of the account number"
        config:
          meta:
            dimension:
              type: string
      - name: inserted_at
        description: "Timestamp when the record was first inserted"
        config:
          meta:
            dimension:
              type: string
      - name: updated_at
        description: "Timestamp when the record was last updated"
        config:
          meta:
            dimension:
              type: string
