models:
  - name: intmdt_teller_balances
    description: "Daily account balance snapshots enriched with account holder details"
    meta:
      hidden: true
    columns:
      - name: balance_pk
        description: "Primary key from raw balances table"
        tests:
          - unique
          - not_null
        config:
          meta:
            dimension:
              type: number
      - name: teller_account_id
        description: "Teller's unique account identifier"
        config:
          meta:
            dimension:
              type: string
      - name: account_key
        description: "Surrogate key based on teller_account_id"
        tests:
          - not_null
        config:
          meta:
            dimension:
              type: string
      - name: date_key
        description: "Balance recorded date as YYYYMMDD integer"
        config:
          meta:
            dimension:
              type: number
      - name: account_holder
        description: "Account holder name (Matt or Jessica)"
        config:
          meta:
            dimension:
              type: string
      - name: account_holder_key
        description: "Surrogate key based on account_holder"
        config:
          meta:
            dimension:
              type: string
      - name: account_name_friendly
        description: "Human-readable account name"
        config:
          meta:
            dimension:
              type: string
      - name: account_type
        description: "Account type (checking, savings, credit)"
        config:
          meta:
            dimension:
              type: string
      - name: account_subtype
        description: "Teller account subtype"
        config:
          meta:
            dimension:
              type: string
      - name: last_four
        description: "Last four digits of the account number"
        config:
          meta:
            dimension:
              type: string
      - name: institution_name
        description: "Name of the financial institution"
        config:
          meta:
            dimension:
              type: string
      - name: ledger_balance
        description: "Posted/ledger balance"
        config:
          meta:
            dimension:
              type: number
      - name: available_balance
        description: "Available balance for spending"
        config:
          meta:
            dimension:
              type: number
      - name: recorded_at
        description: "Full timestamp when balance was recorded"
        config:
          meta:
            dimension:
              type: string
      - name: inserted_at
        description: "Timestamp when the record was inserted"
        config:
          meta:
            dimension:
              type: string
