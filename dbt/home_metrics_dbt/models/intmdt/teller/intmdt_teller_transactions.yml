models:
  - name: intmdt_teller_transactions
    description: "Enriched transactions with account details, category mapping, dimension keys, and income classification"
    meta:
      hidden: true
    columns:
      - name: transaction_pk
        description: "Surrogate key generated from source id"
        tests:
          - unique
          - not_null
        config:
          meta:
            dimension:
              type: string
      - name: transaction_skey
        description: "Surrogate key generated from transaction_pk"
        tests:
          - unique
          - not_null
        config:
          meta:
            dimension:
              type: string
      - name: account_pk
        description: "Primary key from accounts table"
        config:
          meta:
            dimension:
              type: number
      - name: account_key
        description: "Surrogate key based on teller_account_id"
        tests:
          - not_null
        config:
          meta:
            dimension:
              type: string
      - name: account_holder_key
        description: "Surrogate key based on account_holder"
        tests:
          - not_null
        config:
          meta:
            dimension:
              type: string
      - name: transaction_type_key
        description: "Surrogate key based on resolved transaction_type"
        tests:
          - not_null
        config:
          meta:
            dimension:
              type: string
      - name: category_key
        description: "Surrogate key based on resolved category"
        config:
          meta:
            dimension:
              type: string
      - name: vendor_key
        description: "Surrogate key based on resolved vendor"
        config:
          meta:
            dimension:
              type: string
      - name: date_key
        description: "Transaction date as YYYYMMDD integer"
        config:
          meta:
            dimension:
              type: number
      - name: account_holder
        description: "Account holder name (Matt or Jessica)"
        config:
          meta:
            dimension:
              type: string
      - name: account_name_friendly
        description: "Human-readable account name"
        config:
          meta:
            dimension:
              type: string
      - name: last_four
        description: "Last four digits of account number"
        config:
          meta:
            dimension:
              type: string
      - name: account_type
        description: "Account type (checking, savings, credit)"
        config:
          meta:
            dimension:
              type: string
      - name: account_subtype
        description: "Teller account subtype"
        config:
          meta:
            dimension:
              type: string
      - name: account_status
        description: "Account connection status"
        config:
          meta:
            dimension:
              type: string
      - name: institution_id
        description: "Teller's institution identifier"
        config:
          meta:
            dimension:
              type: string
      - name: institution_name
        description: "Name of the financial institution"
        config:
          meta:
            dimension:
              type: string
      - name: enrollment_id
        description: "Teller enrollment identifier"
        config:
          meta:
            dimension:
              type: string
      - name: teller_transaction_id
        description: "Teller's unique transaction identifier"
        config:
          meta:
            dimension:
              type: string
      - name: teller_account_id
        description: "Teller's account identifier"
        config:
          meta:
            dimension:
              type: string
      - name: transaction_date
        description: "Date of the transaction"
        config:
          meta:
            dimension:
              type: date
      - name: transaction_description
        description: "Transaction description from bank"
        config:
          meta:
            dimension:
              type: string
      - name: transaction_amount
        description: "Transaction amount as returned by Teller"
        config:
          meta:
            dimension:
              type: number
      - name: transaction_amount_normalized
        description: "Transaction amount normalized: positive = income, negative = expense"
        config:
          meta:
            dimension:
              type: number
      - name: transaction_status
        description: "Transaction status (pending, posted)"
        config:
          meta:
            dimension:
              type: string
      - name: transaction_type
        description: "Resolved transaction type — income override applied for payroll and direct deposits"
        config:
          meta:
            dimension:
              type: string
      - name: transaction_flow
        description: "expense, income, or zero — derived from transaction_amount_normalized"
        config:
          meta:
            dimension:
              type: string
      - name: category
        description: "Resolved category — custom mapping with fallback to Teller category"
        config:
          meta:
            dimension:
              type: string
      - name: subcategory
        description: "Custom subcategory from seed mapping"
        config:
          meta:
            dimension:
              type: string
      - name: teller_category
        description: "Original transaction category from Teller"
        config:
          meta:
            dimension:
              type: string
      - name: vendor
        description: "Resolved vendor — custom mapping with fallback to Teller vendor name then description"
        config:
          meta:
            dimension:
              type: string
      - name: teller_vendor_name
        description: "Original merchant name from Teller"
        config:
          meta:
            dimension:
              type: string
      - name: is_recurring
        description: "Whether the transaction is recurring per seed mapping"
        config:
          meta:
            dimension:
              type: boolean
      - name: is_mapped
        description: "Whether the transaction matched a custom category mapping"
        config:
          meta:
            dimension:
              type: boolean
      - name: running_balance
        description: "Account balance after transaction"
        config:
          meta:
            dimension:
              type: number
      - name: transaction_inserted_at
        description: "Timestamp when the transaction was first inserted"
        config:
          meta:
            dimension:
              type: string
      - name: transaction_updated_at
        description: "Timestamp when the transaction was last updated"
        config:
          meta:
            dimension:
              type: string
