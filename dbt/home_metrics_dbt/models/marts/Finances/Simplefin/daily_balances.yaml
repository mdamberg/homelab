models:
  - name: daily_balances
    description: "One row per tracked account per day from the account's first balance date through today. Days with no new bank balance carry the last known balance forward."
    config:
      tags: ['lightdash']
    columns:
      - name: daily_balance_skey
        description: "Surrogate key from date_day + account_id"
        tests:
          - unique
          - not_null
        config:
          meta:
            dimension:
              type: string
      - name: balance_skey
        description: "Surrogate key of the bank balance shown on this day; repeats on carried-forward days"
        config:
          meta:
            dimension:
              type: string
      - name: month_start_date
        description: "First day of the month date_day falls in"
        config:
          meta:
            dimension:
              type: date
      - name: date_day
        description: "Calendar day (America/Chicago) the row represents"
        tests:
          - not_null
        config:
          meta:
            dimension:
              type: date
      - name: balance_date
        description: "Date (UTC) the bank last updated the balance shown; earlier than date_day on carried-forward days"
        config:
          meta:
            dimension:
              type: date
      - name: balance_datetime
        description: "Timestamp (UTC) the bank last updated the balance shown"
        config:
          meta:
            dimension:
              type: timestamp
      - name: account_owner
        description: "Account owner from map_financial_accounts"
        config:
          meta:
            dimension:
              type: string
      - name: account_id
        description: "SimpleFIN account identifier (opaque Bridge id, not the bank account number)"
        tests:
          - not_null
        config:
          meta:
            dimension:
              type: string
      - name: account_name
        description: "Clean account name from map_financial_accounts"
        config:
          meta:
            dimension:
              type: string
      - name: conn_id
        description: "SimpleFIN connection id the account belongs to"
        config:
          meta:
            dimension:
              type: string
      - name: institution_name
        description: "Bank the account belongs to (e.g. Wells Fargo)"
        config:
          meta:
            dimension:
              type: string
      - name: currency
        description: "ISO 4217 currency code of the balances (e.g. USD)"
        config:
          meta:
            dimension:
              type: string
      - name: balance
        description: "Ledger balance as of balance_datetime"
        config:
          meta:
            dimension:
              type: number
      - name: available_balance
        description: "Available balance as of balance_datetime; null when SimpleFIN omits it because it equals balance"
        config:
          meta:
            dimension:
              type: number
      - name: is_current_balance
        description: "Flag showing 1 if that rows balance for that account is the most current, 0 if it is not."
        config:
          meta:
            dimension:
              type: number
      - name: holdings
        description: "Investment holdings as JSON text; an empty array ([]) for bank and card accounts"
        config:
          meta:
            dimension:
              type: string
      - name: is_carried_forward
        description: "True when no new bank balance arrived for this day and the balance is carried forward from balance_date"
        tests:
          - not_null
        config:
          meta:
            dimension:
              type: boolean
