models:
  - name: dim_teller_accounts
    description: "Account dimension — one row per open account"
    columns:
      - name: account_pk
        description: "Primary key from raw accounts table"
        tests:
          - unique
          - not_null
        config:
          meta:
            dimension:
              type: number
      - name: account_key
        description: "Surrogate key based on teller_account_id, used for joining with fact tables"
        tests:
          - unique
          - not_null
        config:
          meta:
            dimension:
              type: string
      - name: teller_account_id
        description: "Teller's unique account identifier"
        config:
          meta:
            dimension:
              type: string
      - name: account_holder
        description: "Account holder name (Matt or Jessica)"
        config:
          meta:
            dimension:
              type: string
      - name: account_holder_key
        description: "Surrogate key based on account_holder"
        config:
          meta:
            dimension:
              type: string
      - name: account_name_friendly
        description: "Human-readable account name (e.g. Matt Checking, Jessica WF Credit Card)"
        config:
          meta:
            dimension:
              type: string
      - name: account_type
        description: "Account type (checking, savings, credit)"
        config:
          meta:
            dimension:
              type: string
      - name: account_subtype
        description: "Teller account subtype"
        config:
          meta:
            dimension:
              type: string
      - name: last_four
        description: "Last four digits of the account number"
        config:
          meta:
            dimension:
              type: string
      - name: account_status
        description: "Account connection status (will always be open)"
        config:
          meta:
            dimension:
              type: string
      - name: institution_name
        description: "Name of the financial institution"
        config:
          meta:
            dimension:
              type: string
      - name: institution_id
        description: "Teller's institution identifier"
        config:
          meta:
            dimension:
              type: string
      - name: enrollment_id
        description: "Teller enrollment identifier"
        config:
          meta:
            dimension:
              type: string
