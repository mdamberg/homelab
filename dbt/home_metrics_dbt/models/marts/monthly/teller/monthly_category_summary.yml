models:
  - name: monthly_category_summary
    description: "A monthly, account level view of finances with metrics for total income, 
                  expenses and net for each account"
    
    meta:
      # -- Joins --
      joins:
        - join: dim_teller_accounts
          sql_on: ${monthly_account_summary.account_key} = ${dim_teller_accounts.account_key}
          relationship: many-to-one

        - join: dim_teller_vendors
       #   sql_on: ${monthly_account_summary. dim_teller_vendors.vendor_key} = ${}

      # -- Metrics --
      metrics:
        total_expenses:
          type: sum
          sql: ${total_expenses}
          description: "The total dollar amount of expenses per account for that month"

        total_income:
          type: sum
          sql: ${total_income}
          description: "The total dollar amount of income per account for that month"

        net_income:
          type: sum
          sql: ${net_income}
          description: "The overall net income dollar amount per account for that month"

        max_monthly_balance:
          type: max
          sql: ${max_monthly_balance}
          description: The highest balance for that account for that month

          min_ruinning_balance:
            type: min 
            sql: ${min_ruinning_balance}
            description: "The lowest balance for that account for that month"

    columns:
      - name: monthly_transaction_skey
        description: ""
        tests:
          - not_null
          - unique
        config:
          meta:
            dimension:
              type: string
      - name: month_start_date
        description: ""
        config:
          meta:
            dimension:
              type: date
      - name: month_end_date
        description: ""
        config:
          meta:
            dimension:
              type: date
      - name: account_key
        description: ""
        config:
          meta:
            dimension:
              type: string
      - name: category
        description: ""
        config:
          meta:
            dimension:
              type: string
      - name: total_expenses
        description: ""
        config:
          meta:
            dimension:
              type: number
      - name: total_income
        description: ""
        config:
          meta:
            dimension:
              type: number
      - name: net_income
        description: ""
        config:
          meta:
            dimension:
              type: number
      - name: max_monthly_balance
        description: ""
        config:
          meta:
            dimension:
              type: number
      - name: min_running_balance
        description: ""
        config:
          meta:
            dimension:
              type: number
      - name: large_transaction_occurred
        description: >- 
          "Indicates whether or not a large transaction occurred during this 
          month, for this account."
        config:
          meta:
            dimension:
              type: boolean
