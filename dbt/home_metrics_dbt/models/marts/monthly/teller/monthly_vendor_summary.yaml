models:
  - name: monthly_vendor_summary
    description: "Monthly spend aggregated by account and vendor, with category context"
    columns:
      - name: monthly_vendor_skey
        description: "Surrogate key for month + account + vendor"
        tests:
          - unique
          - not_null
        config:
          meta:
            dimension:
              type: string
      - name: month_start_date
        description: "First day of the month"
        config:
          meta:
            dimension:
              type: date
      - name: month_end_date
        description: "Last day of the month"
        config:
          meta:
            dimension:
              type: date
      - name: account_key
        description: "Surrogate key based on teller_account_id"
        config:
          meta:
            dimension:
              type: string
      - name: vendor_key
        description: "Surrogate key based on resolved vendor name"
        config:
          meta:
            dimension:
              type: string
      - name: vendor
        description: "Resolved vendor name — custom mapping with fallback to Teller
          vendor name then description"
        config:
          meta:
            dimension:
              type: string
      - name: category
        description: "Resolved category — custom mapping with fallback to Teller category"
        config:
          meta:
            dimension:
              type: string
      - name: subcategory
        description: "Custom subcategory from seed mapping"
        config:
          meta:
            dimension:
              type: string
      - name: total_expenses
        description: "Sum of expense transactions for the month"
        config:
          meta:
            dimension:
              type: number
      - name: total_income
        description: "Sum of income transactions for the month"
        config:
          meta:
            dimension:
              type: number
      - name: net_income
        description: "Sum of all normalized transaction amounts for the month"
        config:
          meta:
            dimension:
              type: number
      - name: account_holder_key
        description: ""
        config:
          meta:
            dimension:
              type: string
      - name: account_name_friendly
        description: ""
        config:
          meta:
            dimension:
              type: string
      - name: account_holder
        description: ""
        config:
          meta:
            dimension:
              type: string
