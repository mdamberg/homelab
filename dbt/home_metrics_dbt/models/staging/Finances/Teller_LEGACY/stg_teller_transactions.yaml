models:
  - name: stg_teller_transactions
    description: "Raw transactions from Teller API — rename and type cast only, no business logic"
    meta:
      hidden: true
    columns:
      - name: transaction_pk
        description: "Surrogate key generated from source id"
        tests:
          - unique
          - not_null
        config:
          meta:
            dimension:
              type: string
      - name: teller_transaction_id
        description: "Teller's unique transaction identifier"
        tests:
          - unique
          - not_null
        config:
          meta:
            dimension:
              type: string
      - name: teller_account_id
        description: "Teller's account identifier"
        config:
          meta:
            dimension:
              type: string
      - name: account_key
        description: "Surrogate key based on teller_account_id"
        config:
          meta:
            dimension:
              type: string
      - name: date_key
        description: "Transaction date as YYYYMMDD integer"
        config:
          meta:
            dimension:
              type: number
      - name: transaction_date
        description: "Date of the transaction"
        config:
          meta:
            dimension:
              type: date
      - name: transaction_description
        description: "Raw transaction description from bank"
        config:
          meta:
            dimension:
              type: string
      - name: transaction_amount
        description: "Transaction amount as returned by Teller"
        config:
          meta:
            dimension:
              type: number
      - name: transaction_status
        description: "Transaction status (pending, posted)"
        config:
          meta:
            dimension:
              type: string
      - name: transaction_type
        description: "Raw transaction type from Teller (credit, debit)"
        config:
          meta:
            dimension:
              type: string
      - name: teller_category
        description: "Transaction category assigned by Teller"
        config:
          meta:
            dimension:
              type: string
      - name: teller_vendor_name
        description: "Merchant name assigned by Teller"
        config:
          meta:
            dimension:
              type: string
      - name: running_balance
        description: "Account balance after transaction"
        config:
          meta:
            dimension:
              type: number
      - name: inserted_at
        description: "Timestamp when the record was first inserted"
        config:
          meta:
            dimension:
              type: string
      - name: updated_at
        description: "Timestamp when the record was last updated"
        config:
          meta:
            dimension:
              type: string
