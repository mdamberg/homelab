version: 2

models:
  - name: stg_media_library_present
    description: "Media entities currently present in the library. Keeps only rows written
      by the latest n8n run per source, and for Radarr/Sonarr only items with a file on
      disk, so an item that disappears drops out of this view. Source for media_library_snapshot.
      Grain: 1 row per media entity (source + title)."
    meta:
      hidden: true
    columns:
      - name: media_key
        description: "Surrogate key for the media entity (source + title)"
        tests:
          - unique
          - not_null
        config:
          meta:
            dimension:
              type: string
      - name: source
        description: "System the row came from (plex, radarr, sonarr)"
        tests:
          - not_null
        config:
          meta:
            dimension:
              type: string
      - name: library_name
        description: "Name of the library the entity belongs to"
        config:
          meta:
            dimension:
              type: string
      - name: title
        description: "Title of the media entity"
        tests:
          - not_null
        config:
          meta:
            dimension:
              type: string
      - name: media_type
        description: "Type of media (movie, tv_show)"
        config:
          meta:
            dimension:
              type: string
      - name: genre
        description: "Up to three genres, comma separated"
        config:
          meta:
            dimension:
              type: string
      - name: year
        description: "Release year"
        config:
          meta:
            dimension:
              type: number
      - name: overview
        description: "Plot summary (Radarr and Sonarr only)"
        config:
          meta:
            dimension:
              type: string
      - name: ratings
        description: "Rating value"
        config:
          meta:
            dimension:
              type: string
      - name: recorded_at
        description: "When the latest n8n run wrote this row. Equal to the source's most recent run for every row in this view."
        config:
          meta:
            dimension:
              type: timestamp
      - name: inserted_at
        description: "When the entity was first seen in the raw table"
        config:
          meta:
            dimension:
              type: timestamp
      - name: bitrate
        description: "Bitrate of the media file (Plex only)"
        config:
          meta:
            dimension:
              type: string
      - name: added_at_utc
        description: "When the entity was added, in UTC. Plex: added to Plex. Radarr/Sonarr: added to Radarr/Sonarr."
        tests:
          - not_null
        config:
          meta:
            dimension:
              type: timestamp
      - name: added_at_ts
        description: "added_at_utc converted to local time"
        config:
          meta:
            dimension:
              type: timestamp
      - name: date_added
        description: "Date the entity was added"
        config:
          meta:
            dimension:
              type: date
      - name: studio
        description: "Studio that produced the movie (Radarr only)"
        config:
          meta:
            dimension:
              type: string
      - name: runtime
        description: "Runtime in minutes (Radarr and Sonarr)"
        config:
          meta:
            dimension:
              type: string
      - name: has_file
        description: "Whether Radarr has a file on disk for the movie (Radarr only)"
        config:
          meta:
            dimension:
              type: string
      - name: file_size
        description: "File size in bytes (Plex only)"
        config:
          meta:
            dimension:
              type: string
      - name: play_count
        description: "Number of plays (Plex only)"
        config:
          meta:
            dimension:
              type: string
      - name: rating_key
        description: "Plex rating key (Plex only)"
        config:
          meta:
            dimension:
              type: string
      - name: last_played
        description: "Epoch seconds of the last play (Plex only)"
        config:
          meta:
            dimension:
              type: string
      - name: episode_file_count
        description: "Number of episode files on disk (Sonarr only)"
        config:
          meta:
            dimension:
              type: string
      - name: monitored
        description: "Whether the entity is monitored in Radarr/Sonarr"
        config:
          meta:
            dimension:
              type: string
