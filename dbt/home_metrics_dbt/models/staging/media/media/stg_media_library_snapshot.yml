version: 2

models:
  - name: stg_media_library_snapshot
    description: "SCD2 history of media entities present in the library, from media_library_snapshot. Grain: 1 row per media entity per version."
    meta:
      hidden: true
    columns:
      - name: dbt_scd_id
        description: "Unique id for each version of each media entity"
        tests:
          - unique
          - not_null
        config:
          meta:
            dimension:
              type: string
      - name: media_key
        description: "Surrogate key for the media entity (source + title)"
        tests:
          - not_null
        config:
          meta:
            dimension:
              type: string
      - name: media_source_key
        description: "Surrogate key for the media source"
        tests:
          - not_null
        config:
          meta:
            dimension:
              type: string
      - name: media_type_key
        description: "Surrogate key for the media type (not unique per row - shared by
          items of same source/type)"
        tests:
          - not_null
        config:
          meta:
            dimension:
              type: string
      - name: source
        description: "Source of the media library (e.g., Sonarr, Radarr)"
        config:
          meta:
            dimension:
              type: string
      - name: media_type
        description: "Type of media (e.g., movie, tv show)"
        config:
          meta:
            dimension:
              type: string
      - name: library_name
        description: "Name of the library"
        config:
          meta:
            dimension:
              type: string
      - name: title
        description: "Title of the media item"
        config:
          meta:
            dimension:
              type: string
      - name: genre
        description: "Genre(s) of the media item"
        config:
          meta:
            dimension:
              type: string
      - name: year
        description: "Release year"
        config:
          meta:
            dimension:
              type: string
      - name: ratings
        description: "Rating value"
        config:
          meta:
            dimension:
              type: string
      - name: studio
        description: "The studio which produced the movie."
        config:
          meta:
            dimension:
              type: string
      - name: run_time
        description: "Duration of the media entity in minutes."
        config:
          meta:
            dimension:
              type: string
      - name: bitrate
        description: "Bitrate of the media file (Plex only)"
        config:
          meta:
            dimension:
              type: string
      - name: rating_key
        description: "Plex rating key (Plex only)"
        config:
          meta:
            dimension:
              type: string
      - name: date_added
        description: "Date the entity was added"
        config:
          meta:
            dimension:
              type: date
      - name: added_at_utc
        description: "When the entity was added, in UTC"
        config:
          meta:
            dimension:
              type: timestamp
      - name: added_at_ts
        description: "When the entity was added, local time"
        config:
          meta:
            dimension:
              type: timestamp
      - name: date_inserted
        description: "Timestamp when the record was inserted into the raw table"
        config:
          meta:
            dimension:
              type: date
      - name: inserted_at_ts
        description: "Timestamp when the record was inserted into the raw table"
        config:
          meta:
            dimension:
              type: timestamp
      - name: dbt_updated_at
        description: "Value of the snapshot updated_at column when this version was captured"
        config:
          meta:
            dimension:
              type: timestamp
      - name: dbt_valid_from
        description: "Start of this version validity (the entity added date)"
        config:
          meta:
            dimension:
              type: timestamp
      - name: dbt_valid_to
        description: "End of this version validity; null while current"
        config:
          meta:
            dimension:
              type: timestamp
