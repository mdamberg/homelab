version: 2

# ================================================================================================================================== #
# GRAIN: 1 row per alert
#
# Category Types
#   1. execution    — a workflow node threw an error during execution
#   2. data_quality — a monitored table has not received new data within the staleness threshold (no run context)
#   3. unknown      — alert_type does not match any known category
#
# Alert Types:
#   1. node_error — a node within an n8n workflow throws an error during execution
#       - execution_id: unique ID of the workflow execution
#       - workflow_id: n8n's unique identifier for the workflow definition
#       - failed_node: name of the specific node that threw the error
#
#   2. no_data — a data quality check detected a table has not received new data within a threshold
#       - monitored_table: the table being watched
#       - threshold_minutes: how many minutes without new data before the alert fires
#       - NOTE: no_data alerts have no execution context — execution_id is null
# ================================================================================================================================== #


models:
  - name: stg_n8n_alerts
    description: "Staging table for n8n alerts — workflow execution errors and data staleness checks"
    meta:
      hidden: true
    columns:
      - name: alert_pk
        description: "Unique identifier for each alert record"
        tests:
          - unique
          - not_null
        config:
          meta:
            dimension:
              type: number
      - name: alert_type_key
        description: "Surrogate key combining alert_source and alert_type — uniquely identifies a distinct alert type per source"
        config:
          meta:
            dimension:
              type: string
      - name: alert_severity_key
        description: "Surrogate key combining alert_source, alert_type, and severity — uniquely identifies a distinct alert type + severity per source"
        config:
          meta:
            dimension:
              type: string
      - name: alert_type
        description: "Type of alert — 'node_error' for workflow execution failures, 'no_data' for data staleness checks"
        config:
          meta:
            dimension:
              type: string
      - name: alert_category
        description: "Broad category of the alert — 'execution' for node_error alerts, 'data_quality' for no_data alerts, 'unknown' otherwise"
        config:
          meta:
            dimension:
              type: string
      - name: severity
        description: "Severity level of the alert (warning, error)"
        config:
          meta:
            dimension:
              type: string
      - name: alert_source
        description: "The workflow name in snake_case format as recorded by the alerting system"
        config:
          meta:
            dimension:
              type: string
      - name: title
        description: "Short human-readable alert title"
        config:
          meta:
            dimension:
              type: string
      - name: message
        description: "Detailed alert message body"
        config:
          meta:
            dimension:
              type: string
      - name: triggered_at
        description: "UTC timestamp when the alert was triggered"
        config:
          meta:
            dimension:
              type: timestamp
      - name: triggered_at_local
        description: "Alert trigger timestamp converted to local time"
        config:
          meta:
            dimension:
              type: timestamp
      - name: date_triggered
        description: "Date portion of the alert trigger timestamp (local time)"
        config:
          meta:
            dimension:
              type: date
      - name: time_triggered
        description: "Time portion of the alert trigger timestamp (local time)"
        config:
          meta:
            dimension:
              type: timestamp
      - name: resolved_at
        description: "Timestamp when the alert was resolved — null if the alert is still active"
        config:
          meta:
            dimension:
              type: timestamp
      - name: is_active
        description: "True if the alert has not yet been resolved"
        config:
          meta:
            dimension:
              type: boolean
      - name: inserted_at
        description: "Timestamp when the alert record was inserted into the database"
        config:
          meta:
            dimension:
              type: timestamp
      - name: execution_id
        description: "n8n execution ID parsed from alert metadata — populated for node_error alerts only, null for no_data alerts"
        config:
          meta:
            dimension:
              type: number
      - name: workflow_id
        description: "n8n workflow definition ID parsed from alert metadata — populated for node_error alerts only"
        config:
          meta:
            dimension:
              type: string
      - name: failed_node
        description: "Name of the specific node that threw an error — populated for node_error alerts only"
        config:
          meta:
            dimension:
              type: string
      - name: monitored_table
        description: "Table being watched for data staleness — populated for no_data alerts only"
        config:
          meta:
            dimension:
              type: string
      - name: threshold_minutes
        description: "Minutes without new data before the no_data alert fires — populated for no_data alerts only"
        config:
          meta:
            dimension:
              type: number
      - name: metadata
        description: "Raw JSON metadata from the alert record"
        config:
          meta:
            dimension:
              type: string
