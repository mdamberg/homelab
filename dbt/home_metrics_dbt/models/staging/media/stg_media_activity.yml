version: 2

models:
  - name: stg_media_activity
    description: "Staging table for media activity data"
    meta:
      hidden: true
    columns:
      - name: media_source_key
        description: "Unique identifier for each media source"
        tests:
          - not_null
        config:
          meta:
            dimension:
              type: string
      - name: user_key
        description: "Unique identifier for each user within a media source"
        config:
          meta:
            dimension:
              type: string
      - name: media_activity_key
        description: "Unique identifier for each media activity record"
        tests:
          - unique
          - not_null
        config:
          meta:
            dimension:
              type: string
      - name: source
        description: "Source of the media activity (e.g., Prowlarr, Sonarr, Radarr)"
        config:
          meta:
            dimension:
              type: string
      - name: user_name
        description: "Username"
        config:
          meta:
            dimension:
              type: string
      - name: media_type
        description: "Type of media activity (e.g., download, delete)"
        config:
          meta:
            dimension:
              type: string
      - name: title
        description: "Title of the media item"
        config:
          meta:
            dimension:
              type: string
      - name: series_title
        description: "Title of the series (if applicable)"
        config:
          meta:
            dimension:
              type: string
      - name: duration_seconds
        description: "Duration of the media activity in seconds"
        config:
          meta:
            dimension:
              type: number
      - name: watched_at
        description: "Timestamp when the media was watched"
        config:
          meta:
            dimension:
              type: timestamp
      - name: release_year
        description: "Year of media items release"
        config:
          meta:
            dimension:
              type: timestamp
      - name: media_player
        description: "The entity on which the media was watched"
        config:
          meta:
            dimension:
              type: string
      - name: watched_status
        description: "A flag indicaing if the media item has been wached (1) or not (0)"
        config:
          meta:
            dimension:
              type: number
      - name: percent_complete
        description: "Indicates the pecent of the media that has been watched."
        config:
          meta:
            dimension:
              type: number
      - name: inserted_at
        description: "timestamp for the time the media was inserted into the DB."
        config:
          meta:
            dimension:
              type: timestamp
      - name: metadata
        description: "Additional metadata related to the media activity in JSON format"
        config:
          meta:
            dimension:
              type: string
