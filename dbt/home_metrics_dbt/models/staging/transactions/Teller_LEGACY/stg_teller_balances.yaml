models:
  - name: stg_teller_balances
    description: "Raw daily account balance snapshots from Teller API — rename and type cast only, no business logic"
    meta:
      hidden: true
    columns:
      - name: balance_pk
        description: "Primary key from raw table"
        tests:
          - unique
          - not_null
        config:
          meta:
            dimension:
              type: number
      - name: teller_account_id
        description: "Teller's unique account identifier"
        config:
          meta:
            dimension:
              type: string
      - name: account_key
        description: "Surrogate key based on teller_account_id"
        config:
          meta:
            dimension:
              type: string
      - name: date_key
        description: "Balance recorded date as YYYYMMDD integer"
        config:
          meta:
            dimension:
              type: number
      - name: ledger_balance
        description: "Posted/ledger balance"
        config:
          meta:
            dimension:
              type: number
      - name: available_balance
        description: "Available balance for spending"
        config:
          meta:
            dimension:
              type: number
      - name: recorded_at
        description: "Full timestamp when balance was recorded"
        config:
          meta:
            dimension:
              type: string
      - name: inserted_at
        description: "Timestamp when the record was inserted"
        config:
          meta:
            dimension:
              type: string
