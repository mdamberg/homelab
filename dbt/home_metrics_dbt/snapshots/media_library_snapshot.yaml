snapshots:
  - name: media_library_snapshot
    description: "SCD2 history of media entities present in the library, one row per
      entity per version. dbt_valid_from is the entity's added date and dbt_valid_to closes
      when the entity drops out of stg_media_library_present (removed, or file no longer on disk).
      Current rows have a null dbt_valid_to."
    columns:
      - name: dbt_scd_id
        description: "Unique id for each version of each entity"
        tests:
          - unique
          - not_null
      - name: media_key
        description: "Surrogate key for the media entity (source + title)"
        tests:
          - not_null
      - name: source
        description: "System the row came from (plex, radarr, sonarr)"
      - name: media_type
        description: "Type of media (movie, tv_show)"
      - name: library_name
        description: "Name of the library the entity belongs to"
      - name: title
        description: "Title of the media entity"
      - name: genre
        description: "Up to three genres, comma separated"
      - name: year
        description: "Release year"
      - name: overview
        description: "Plot summary (Plex, Radarr and Sonarr)"
      - name: inserted_at
        description: "When the entity was first seen in the raw table"
      - name: added_at_utc
        description: "When the entity was added, in UTC. The snapshot's updated_at column."
      - name: added_at_ts
        description: "added_at_utc converted to local time"
      - name: date_added
        description: "Date the entity was added"
      - name: produced_by
        description: "Studio that produced the entity, falling back to the network (Plex, Radarr and Sonarr)"
      - name: certification_rating
        description: "Content rating, e.g. G, PG, PG-13, R, TV-MA"
      - name: has_file
        description: "Whether a file exists on disk for the entity (true/false)"
      - name: file_size
        description: "File size in bytes"
      - name: runtime
        description: "Runtime in minutes (Plex, Radarr and Sonarr)"
      - name: dbt_updated_at
        description: "Value of the updated_at column when this version was captured"
      - name: dbt_valid_from
        description: "Start of this version's validity (the entity's added_at_utc)"
      - name: dbt_valid_to
        description: "End of this version's validity; null while current"
