<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --paper:#0B0910; --card:#161221; --card2:#1E1830; --ink:#EDE9F7; --muted:#8B84A8;
    --rule:#2C2740;
    /* neon palette */
    --purple:#B23BFF; --cyan:#28E0E6; --yellow:#E6FF3A; --danger:#FF5C7A;
    /* semantic aliases kept so existing component rules stay readable */
    --field:var(--cyan); --brick:var(--purple); --marker:var(--yellow);
    --data: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --disp: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--disp);
       -webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:14px 12px 60px}
  .mast{display:flex;align-items:flex-end;justify-content:space-between;
        border-bottom:3px solid var(--purple);box-shadow:0 3px 14px -6px var(--purple);
        padding-bottom:6px;margin-bottom:14px;gap:10px}
  .mast h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.04em;
           text-transform:uppercase;line-height:.9;
           text-shadow:0 0 12px rgba(178,59,255,.35)}
  .mast .sub{font-family:var(--data);font-size:10px;color:var(--muted);
             text-transform:uppercase;letter-spacing:.14em;margin-top:4px}
  .wk{font-family:var(--data);font-size:11px;text-align:right;line-height:1.5;white-space:nowrap;color:var(--muted)}
  .wk b{display:block;font-size:22px;letter-spacing:-.03em;color:var(--cyan)}
  /* top-level view tabs */
  .nav{display:flex;margin-bottom:14px}
  .nav button{flex:1;background:var(--card);color:var(--muted);border:1px solid var(--rule);
    border-right:0;padding:11px 10px;font-family:var(--data);font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;cursor:pointer;border-radius:0}
  .nav button:last-child{border-right:1px solid var(--rule)}
  .nav button.on{background:var(--purple);color:#0B0910;border-color:var(--purple);font-weight:700;
    box-shadow:0 0 16px rgba(178,59,255,.5)}
  .setup{background:var(--card);border:1px solid var(--rule);padding:10px;margin-bottom:14px}
  .setup label{display:block;font-family:var(--data);font-size:9px;letter-spacing:.14em;
               text-transform:uppercase;color:var(--muted);margin-bottom:3px}
  .setup input,.setup select{width:100%;padding:7px 8px;border:1px solid var(--rule);
    background:var(--card2);font-family:var(--data);font-size:13px;color:var(--ink);border-radius:0}
  .row2{display:flex;gap:8px;margin-bottom:8px}.row2>div{flex:1;min-width:0}
  summary{font-family:var(--data);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
          color:var(--muted);cursor:pointer;list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::before{content:'\25B8 ';}
  details[open] summary::before{content:'\25BE ';}
  details[open] summary{margin-bottom:10px}
  button{font-family:var(--data);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    background:var(--purple);color:#0B0910;border:0;padding:9px 14px;cursor:pointer;border-radius:0;
    box-shadow:0 0 12px rgba(178,59,255,.35)}
  button:disabled{opacity:.4;cursor:default;box-shadow:none}
  button.ghost{background:none;color:var(--muted);border:1px solid var(--rule);padding:7px 10px;box-shadow:none}
  :focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
  h2{font-family:var(--data);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
     color:var(--muted);margin:22px 0 7px;display:flex;justify-content:space-between;align-items:baseline}
  h2 span{color:var(--cyan);font-weight:400}
  .slot{display:flex;background:var(--card);border:1px solid var(--rule);
        border-top:0;align-items:stretch;min-height:46px}
  .slot:first-of-type{border-top:1px solid var(--rule)}
  .slot.tap{cursor:pointer}
  .slot.tap:hover{background:var(--card2)}
  .tab{background:var(--card2);color:var(--cyan);font-family:var(--data);font-size:10px;
       font-weight:700;letter-spacing:.06em;width:46px;flex:0 0 46px;display:flex;
       align-items:center;justify-content:center;border-right:1px solid var(--rule)}
  .tab.flex{background:var(--yellow);color:#12101C}
  .tab.bn{background:none;color:var(--muted)}
  .who{flex:1;padding:7px 10px;min-width:0;display:flex;flex-direction:column;justify-content:center}
  .nm{font-size:14px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;
      overflow:hidden;text-overflow:ellipsis}
  .meta{font-family:var(--data);font-size:10px;color:var(--muted);letter-spacing:.03em;margin-top:1px}
  .inj{color:var(--yellow);font-weight:700}
  .good{color:var(--cyan);font-weight:700}
  /* dual proj/live points cell */
  .pt{font-family:var(--data);padding:7px 10px;display:flex;flex-direction:column;
      align-items:flex-end;justify-content:center;min-width:60px}
  .pt .live{font-size:16px;font-weight:700;color:var(--cyan);letter-spacing:-.02em;line-height:1;
            text-shadow:0 0 9px rgba(40,224,230,.35)}
  .pt .live.dim{color:var(--muted);text-shadow:none}
  .pt .proj{font-size:9px;color:var(--muted);letter-spacing:.04em;margin-top:3px;text-transform:uppercase}
  .swap{background:rgba(178,59,255,.10);border:1px solid var(--purple);border-top:0;
        padding:8px 10px 8px 46px;font-family:var(--data);font-size:11px;line-height:1.6}
  .swap b{color:var(--purple);letter-spacing:.08em}
  .swap .delta{float:right;font-weight:700;color:var(--purple)}
  .swap .why{color:var(--muted);display:block;margin-top:3px}
  .move{background:rgba(40,224,230,.09);border:1px solid var(--cyan);border-top:0;
        padding:8px 10px;font-family:var(--data);font-size:11px;line-height:1.6}
  .move b{color:var(--cyan);letter-spacing:.08em}
  .move .bid{float:right;font-weight:700;color:var(--cyan)}
  .move .why{color:var(--muted);display:block;margin-top:3px}
  .tot{display:flex;background:var(--card2);color:var(--ink);border:1px solid var(--rule);
       font-family:var(--data);font-size:12px;padding:9px 10px;justify-content:space-between;
       align-items:center;letter-spacing:.06em}
  .tot b{font-size:16px;color:var(--cyan);text-shadow:0 0 9px rgba(40,224,230,.35)}
  .tabs{display:flex;flex-wrap:wrap}
  .tabs button{background:none;color:var(--muted);border:1px solid var(--rule);
               border-right:0;padding:7px 11px;font-size:10px;box-shadow:none}
  .tabs button:last-child{border-right:1px solid var(--rule)}
  .tabs button.on{background:var(--purple);color:#0B0910;border-color:var(--purple);
                  box-shadow:0 0 14px rgba(178,59,255,.45)}
  /* waiver-area sub-tab switch (Waiver | Trades) */
  .secttabs{display:flex;margin:22px 0 7px}
  .secttabs button{flex:1;background:var(--card);color:var(--muted);border:1px solid var(--rule);
    border-right:0;padding:9px 10px;font-family:var(--data);font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;cursor:pointer;box-shadow:none;border-radius:0}
  .secttabs button:last-child{border-right:1px solid var(--rule)}
  .secttabs button.on{background:var(--purple);color:#0B0910;border-color:var(--purple);font-weight:700;
    box-shadow:0 0 12px rgba(178,59,255,.4)}
  .move .tap{cursor:pointer;border-bottom:1px dotted var(--rule)}
  /* matchup head-to-head */
  .vhead{display:flex;align-items:center;justify-content:space-between;gap:8px;
         background:var(--card);border:1px solid var(--rule);padding:12px 12px}
  .vteam{flex:1;min-width:0}
  .vteam.right{text-align:right}
  .vname{font-size:13px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;
         overflow:hidden;text-overflow:ellipsis}
  .vscore{font-family:var(--data);font-size:30px;font-weight:700;letter-spacing:-.03em;
          color:var(--cyan);line-height:1.05;text-shadow:0 0 12px rgba(40,224,230,.4)}
  .vproj{font-family:var(--data);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .vmid{flex:0 0 auto;font-family:var(--data);font-size:11px;color:var(--purple);
        font-weight:700;letter-spacing:.14em}
  .vmargin{font-family:var(--data);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
           text-align:center;padding:7px 10px;border:1px solid var(--rule);border-top:0;color:var(--muted)}
  .vmargin.up{color:var(--cyan)} .vmargin.down{color:var(--yellow)}
  .vs{margin-top:0}
  .vsrow{display:flex;align-items:stretch;background:var(--card);border:1px solid var(--rule);border-top:0}
  .vsrow.first{border-top:1px solid var(--rule)}
  .vsp{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:6px 8px}
  .vsp.l{justify-content:flex-end;text-align:right}
  .vsp.r{justify-content:flex-start;text-align:left}
  .vsp.tap{cursor:pointer}
  .vsp.tap:hover{background:var(--card2)}
  .vsp.empty{color:var(--muted);font-family:var(--data);font-size:11px;justify-content:center}
  .vslot{flex:0 0 44px;display:flex;align-items:center;justify-content:center;background:var(--card2);
         color:var(--muted);font-family:var(--data);font-size:10px;font-weight:700;
         border-left:1px solid var(--rule);border-right:1px solid var(--rule)}
  .vpts{font-family:var(--data);font-size:15px;font-weight:700;color:var(--cyan);
        min-width:40px;text-align:center;text-shadow:0 0 8px rgba(40,224,230,.3)}
  .vinfo{min-width:0}
  .vnm{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vmeta{font-family:var(--data);font-size:9px;color:var(--muted);letter-spacing:.02em}
  .chat{background:var(--card);border:1px solid var(--rule);padding:10px;margin-top:8px}
  .bub{font-size:13px;line-height:1.55;margin-bottom:9px;padding:8px 10px;white-space:pre-wrap}
  .bub.a{background:var(--card2);border-left:3px solid var(--yellow)}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
  .chips button{background:none;border:1px solid var(--rule);color:var(--muted);
                padding:5px 8px;font-size:9px;text-transform:none;letter-spacing:.02em;box-shadow:none}
  .veil{position:fixed;inset:0;background:rgba(6,4,12,.72);display:flex;
        align-items:flex-end;justify-content:center;z-index:50;padding:0}
  .sheet{background:var(--card);width:100%;max-width:560px;max-height:82vh;overflow-y:auto;
         border-top:4px solid var(--purple);box-shadow:0 -6px 30px -10px var(--purple)}
  .sheet .hd{padding:14px 14px 10px;border-bottom:1px solid var(--rule);
             display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .sheet h3{margin:0;font-size:20px;font-weight:800;letter-spacing:-.03em}
  .statgrid{display:grid;grid-template-columns:1fr 1fr;gap:0}
  .statgrid div{padding:8px 14px;border-bottom:1px solid var(--rule);
                font-family:var(--data);font-size:12px;display:flex;justify-content:space-between}
  .statgrid div:nth-child(odd){border-right:1px solid var(--rule)}
  .statgrid span{color:var(--muted)}
  .note{font-family:var(--data);font-size:10px;color:var(--muted);line-height:1.7;
        margin-top:26px;border-top:1px solid var(--rule);padding-top:10px}
  .empty{background:var(--card);border:1px solid var(--rule);padding:22px 14px;text-align:center}
  .empty b{display:block;font-family:var(--data);font-size:12px;letter-spacing:.1em;
           text-transform:uppercase;color:var(--ink);margin-bottom:6px}
  .empty span{font-size:13px;color:var(--muted);line-height:1.5}
  .err{background:rgba(255,92,122,.09);border:1px solid var(--danger);padding:12px;margin-bottom:14px;
       font-size:13px;line-height:1.55}
  .err b{display:block;font-family:var(--data);font-size:10px;letter-spacing:.14em;
         text-transform:uppercase;color:var(--danger);margin-bottom:5px}
  .err code{font-family:var(--data);font-size:11px;background:var(--card2);padding:1px 4px}
  .load{font-family:var(--data);font-size:11px;color:var(--muted);letter-spacing:.1em;
        text-transform:uppercase;padding:20px 0}
</style>

<div class="wrap">
  <div class="mast">
    <div>
      <h1>Call&nbsp;Sheet</h1>
      <div class="sub" id="lgname">not connected</div>
    </div>
    <div class="wk"><b id="wknum">—</b><span id="wkseason"></span></div>
  </div>

  <div id="nav"></div>

  <details class="setup" id="cfgbox">
    <summary>League setup</summary>
    <div class="row2">
      <div><label for="lid">Sleeper league ID</label>
        <input id="lid" inputmode="numeric" value="1389736503239802880"></div>
    </div>
    <div class="row2">
      <div><label for="proxy">CORS proxy</label>
        <input id="proxy" value="https://sleeper-proxy.mattdamberg.workers.dev/?url="></div>
    </div>
    <div class="row2">
      <div><label for="team">Your team</label>
        <select id="team"><option value="">— load a league first —</option></select></div>
    </div>
    <div class="row2" style="align-items:flex-end;margin-bottom:0">
      <div style="flex:0 0 auto"><button id="go">Load week</button></div>
      <div style="flex:0 0 auto"><button class="ghost" id="clear">Clear cache</button></div>
    </div>
  </details>

  <div id="msg"></div>
  <div id="out"></div>
  <div class="note" id="foot"></div>
</div>
<div id="modal"></div>

<script>
const $ = s => document.querySelector(s);
const S = { proxy:'', players:{}, proj:{}, ros:{}, league:null, rosters:[], users:[],
            week:null, season:null, rosterId:null, wpos:'RB', wtab:'waiver', ctx:null,
            matchups:null, live:{}, liveOn:false, view:'sheet' };

const mem = {};
async function kvGet(k){ try{ const v = localStorage.getItem('cs_'+k); return v?JSON.parse(v):null; }catch(e){ return mem[k] ?? null; } }
async function kvSet(k,v){ try{ localStorage.setItem('cs_'+k, JSON.stringify(v)); }catch(e){ mem[k]=v; } }
async function kvDel(k){ try{ localStorage.removeItem('cs_'+k); }catch(e){ delete mem[k]; } }
function cfgObj(){ return {lid:$('#lid').value.trim(), rosterId:S.rosterId, proxy:S.proxy,
                          view:S.view, wtab:S.wtab}; }

async function j(url){
  const r = await fetch(S.proxy ? S.proxy + encodeURIComponent(url) : url);
  if(!r.ok) throw new Error(r.status + ' — ' + url);
  return r.json();
}
async function jSoft(url){ try { return await j(url); } catch(e){ return null; } }

const POS = ['QB','RB','WR','TE','K'];
async function loadPlayers(){
  const today = new Date().toISOString().slice(0,10);
  const c = await kvGet('players');
  if(c && c.date === today && Object.keys(c.map||{}).length) return c.map;
  const map = {};
  const keep = o => ({
    n: o.full_name || ((o.first_name||'')+' '+(o.last_name||'')).trim() || o.player_id,
    t: o.team || 'FA', p: o.position || '', i: o.injury_status || '',
    d: o.depth_chart_order ?? null, a: o.age ?? null, y: o.years_exp ?? null,
    nb: o.number ?? null, no: o.injury_notes || ''
  });
  for(const p of POS){
    const d = await j('https://api.sleeper.app/v1/players/nfl?position='+p+'&active=true');
    for(const id in d) map[id] = keep(d[id]);
  }
  const def = await j('https://api.sleeper.app/v1/players/nfl?position=DEF');
  for(const id in def) map[id] = keep(def[id]);
  await kvSet('players', {date:today, map});
  return map;
}

function score(stats, pos, scoring){
  if(!stats) return 0;
  if(pos === 'DEF' && stats.pts_ppr != null) return stats.pts_ppr;
  let t=0, hits=0;
  for(const k in scoring){
    const v = stats[k];
    if(typeof v === 'number'){ t += scoring[k]*v; hits++; }
  }
  if(hits < 2) return stats.pts_ppr ?? stats.pts_half_ppr ?? stats.pts_std ?? 0;
  return t;
}
const FLEXMAP = { FLEX:['RB','WR','TE'], WRRB_FLEX:['RB','WR'], REC_FLEX:['WR','TE'],
                  SUPER_FLEX:['QB','RB','WR','TE'] };
const eligible = (slot,pos) => FLEXMAP[slot] ? FLEXMAP[slot].includes(pos) : slot === pos;

function bestLineup(slots, pool){
  const order = slots.map((s,i)=>({s,i,w:FLEXMAP[s]?FLEXMAP[s].length:1})).sort((a,b)=>a.w-b.w);
  const used = new Set(), out = new Array(slots.length).fill(null);
  for(const {s,i} of order){
    for(const p of pool){
      if(used.has(p.id) || !eligible(s,p.pos)) continue;
      used.add(p.id); out[i] = p; break;
    }
  }
  return out;
}
const fmt = n => (Math.round(n*10)/10).toFixed(1);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slabel = s => s.replace('SUPER_FLEX','SFLX').replace('WRRB_FLEX','W/R')
                     .replace('REC_FLEX','W/T').replace('FLEX','FLX');

// build a display record for a player id, blending projection + live actual score
function mk(id){
  const m = S.players[id] || {n:id,t:'?',p:'?',i:''};
  const sc = S.league.scoring_settings;
  return { id, name:m.n, team:m.t, pos:m.p, inj:m.i, dc:m.d,
           pts: score(S.proj[id], m.p, sc), ros: score(S.ros[id], m.p, sc),
           live: (S.live && S.live[id] != null) ? S.live[id] : null };
}

async function run(){
  const lid = $('#lid').value.trim();
  S.proxy = $('#proxy').value.trim();
  if(!lid) return err('No league ID','Paste your Sleeper league ID. It is the long number in your league URL on sleeper.app.');
  $('#msg').innerHTML=''; $('#out').innerHTML='<div class="load">Pulling league…</div>';
  $('#go').disabled = true;
  try{
    const st = await j('https://api.sleeper.app/v1/state/nfl');
    S.week = st.display_week || st.week; S.season = st.season;
    $('#wknum').textContent = 'WK ' + S.week;
    $('#wkseason').textContent = S.season + ' ' + (st.season_type||'').toUpperCase();
    S.league  = await j('https://api.sleeper.app/v1/league/'+lid);
    S.rosters = await j('https://api.sleeper.app/v1/league/'+lid+'/rosters');
    S.users   = await j('https://api.sleeper.app/v1/league/'+lid+'/users');
    $('#lgname').textContent = S.league.name;
    fillTeams();
    $('#out').innerHTML='<div class="load">Pulling players and projections…</div>';
    S.players = await loadPlayers();
    const q = ['QB','RB','WR','TE','K','DEF'].map(p=>'position[]='+p).join('&');
    const pr = await j('https://api.sleeper.com/projections/nfl/'+S.season+'/'+S.week+'?season_type=regular&'+q);
    S.proj = {};
    (Array.isArray(pr)?pr:Object.values(pr)).forEach(o=>{ if(o&&o.player_id) S.proj[o.player_id]=o.stats||{}; });
    const ros = await jSoft('https://api.sleeper.com/projections/nfl/'+S.season+'?season_type=regular&'+q);
    S.ros = {};
    if(ros) (Array.isArray(ros)?ros:Object.values(ros)).forEach(o=>{ if(o&&o.player_id) S.ros[o.player_id]=o.stats||{}; });
    // live scores + head-to-head pairing for the current week
    S.matchups = await jSoft('https://api.sleeper.app/v1/league/'+lid+'/matchups/'+S.week);
    S.live = {};
    (S.matchups||[]).forEach(m=> Object.assign(S.live, m.players_points||{}));
    S.liveOn = !!(S.matchups && S.matchups.length);
    await kvSet('cfg', cfgObj());
    $('#cfgbox').open = false;
    render();
  }catch(e){ fail(e); }
  finally{ $('#go').disabled = false; }
}

function fillTeams(){
  const u={}; S.users.forEach(x=>u[x.user_id]=x);
  const sel=$('#team'); sel.innerHTML='';
  S.rosters.forEach(r=>{
    const o=document.createElement('option'); o.value=r.roster_id;
    o.textContent=(u[r.owner_id]&&(u[r.owner_id].metadata?.team_name||u[r.owner_id].display_name))||('Roster '+r.roster_id);
    sel.appendChild(o);
  });
  if(S.rosterId) sel.value=S.rosterId; else S.rosterId=+sel.value;
}

function teamName(rid){
  const u={}; S.users.forEach(x=>u[x.user_id]=x);
  const r = S.rosters.find(x=>x.roster_id===+rid);
  const o = r && u[r.owner_id];
  return (o && (o.metadata?.team_name || o.display_name)) || ('Roster '+rid);
}

// top-level view switcher: Call Sheet | Matchup
function paintNav(){
  const n = $('#nav'); if(!n) return;
  if(!S.league){ n.innerHTML=''; return; }
  const tabs = [['sheet','Call Sheet'],['matchup','Matchup']];
  n.innerHTML = '<div class="nav">'+tabs.map(([v,lab])=>
    '<button data-v="'+v+'" class="'+(v===S.view?'on':'')+'">'+lab+'</button>').join('')+'</div>';
  n.querySelectorAll('[data-v]').forEach(b=> b.onclick = ()=>{
    S.view = b.dataset.v; kvSet('cfg', cfgObj()); render();
  });
}

function render(){
  paintNav();
  if(S.view === 'matchup') renderMatchup();
  else renderSheet();
}

function renderSheet(){
  const R = S.rosters.find(r=>r.roster_id === +S.rosterId); if(!R) return;
  const sc = S.league.scoring_settings;
  const slots = (S.league.roster_positions||[]).filter(p=>!['BN','IR','TAXI'].includes(p));
  const pool = (R.players||[]).map(mk).sort((a,b)=>b.pts-a.pts);
  const best = bestLineup(slots, pool);
  const bestIds = new Set(best.filter(Boolean).map(p=>p.id));
  const cur = (R.starters||[]).filter(x=>x && x!=='0');
  const curP = cur.map(id=>pool.find(p=>p.id===id)).filter(Boolean);
  const sum = a => a.reduce((t,p)=>t+(p?p.pts:0),0);
  const bTot = sum(best), cTot = sum(curP);
  const liveTot = curP.reduce((t,p)=>t+(p&&p.live!=null?p.live:0),0);
  let h='';
  h += '<h2>Optimal lineup <span>'+fmt(bTot)+' proj</span></h2>';
  slots.forEach((s,i)=>{
    const p = best[i], fx = !!FLEXMAP[s];
    h += row(p, slabel(s), fx?'flex':'');
  });
  const curSlots = bestLineup(slots, curP.sort((a,b)=>b.pts-a.pts));
  const swaps = [];
  slots.forEach((s,i)=>{
    const inP = best[i], outP = curSlots[i];
    if(inP && (!outP || outP.id !== inP.id)) swaps.push({slot:s, inP, outP});
  });
  h += '<h2>Changes to make <span>'+(swaps.length? '+'+fmt(bTot-cTot)+' pts' : 'lineup is optimal')+'</span></h2>';
  if(!swaps.length){
    h += '<div class="slot"><div class="tab">OK</div><div class="who">'+
         '<div class="nm">Nothing to change</div><div class="meta">Your set lineup already scores the max</div></div></div>';
  } else {
    swaps.forEach(w=>{
      const d = w.outP ? w.inP.pts - w.outP.pts : w.inP.pts;
      let why = [];
      if(w.outP && w.outP.inj) why.push(w.outP.name.split(' ').pop()+' is '+w.outP.inj);
      if(w.inP.inj) why.push('note: '+w.inP.name.split(' ').pop()+' listed '+w.inP.inj);
      if(!why.length) why.push('projection gap of '+fmt(Math.abs(d))+' pts in the '+w.slot+' slot');
      h += '<div class="swap"><span class="delta">+'+fmt(d)+'</span>'+
           '<b>START</b> '+esc(w.inP.name)+' ('+w.inP.pos+' · '+w.inP.team+')'+
           (w.outP? '<br><b>&nbsp;&nbsp;SIT</b> '+esc(w.outP.name)+' ('+w.outP.pos+' · '+w.outP.team+')':'')+
           '<span class="why">'+esc(why.join(' · '))+'</span></div>';
    });
  }
  const rostered = new Set(); S.rosters.forEach(r=>(r.players||[]).forEach(x=>rostered.add(x)));
  const budget = S.league.settings?.waiver_budget ?? 100;
  const spent  = R.settings?.waiver_budget_used ?? 0;
  const left   = budget - spent;
  const posCount = {}; pool.forEach(p=>posCount[p.pos]=(posCount[p.pos]||0)+1);
  const required = {}; slots.forEach(s=>{ if(!FLEXMAP[s]) required[s]=(required[s]||0)+1; });
  const free = Object.keys(S.ros).length ? Object.keys(S.ros) : Object.keys(S.proj);
  const fa = free.filter(id=>!rostered.has(id)).map(mk)
    .filter(p=>['QB','RB','WR','TE','DEF','K'].includes(p.pos) && (p.ros>0 || p.pts>0))
    .sort((a,b)=>(b.ros||b.pts*17)-(a.ros||a.pts*17));
  const droppable = pool.filter(p=>!bestIds.has(p.id))
    .filter(p=>(posCount[p.pos]||0) > (required[p.pos]||0))
    .sort((a,b)=>(a.ros||a.pts*17)-(b.ros||b.pts*17));
  const worstStarter = {};
  best.filter(Boolean).forEach(p=>{ if(worstStarter[p.pos]==null || p.ros < worstStarter[p.pos]) worstStarter[p.pos]=p.ros; });
  const moves = [];
  const usedDrop = new Set();
  fa.slice(0,25).forEach(p=>{
    const d = droppable.find(x=>!usedDrop.has(x.id));
    if(!d) return;
    const gain = (p.ros||0) - (d.ros||0);
    if(gain <= 0 || moves.length >= 4) return;
    usedDrop.add(d.id);
    const upgrade = worstStarter[p.pos]!=null && p.ros > worstStarter[p.pos];
    const pct = upgrade ? .20 : (gain > 30 ? .08 : .02);
    moves.push({p, d, gain, upgrade, bid: Math.max(1, Math.round(left*pct))});
  });
  h += '<h2>Add / drop <span>$'+left+' of $'+budget+' FAAB</span></h2>';
  if(!moves.length){
    h += '<div class="slot"><div class="tab">—</div><div class="who">'+
         '<div class="nm">No clear upgrade available</div>'+
         '<div class="meta">Nobody on waivers out-projects your droppable bench</div></div></div>';
  }
  moves.forEach(m=>{
    h += '<div class="move"><span class="bid">bid $'+m.bid+'</span>'+
         '<b>ADD</b> '+esc(m.p.name)+' ('+m.p.pos+' · '+m.p.team+')<br>'+
         '<b>DROP</b> '+esc(m.d.name)+' ('+m.d.pos+' · '+m.d.team+')'+
         '<span class="why">'+fmt(m.gain)+' more projected points rest-of-season'+
         (m.upgrade? ' · would start over your current '+m.p.pos : ' · bench depth only')+'</span></div>';
  });
  const bench = pool.filter(p=>!bestIds.has(p.id));
  h += '<h2>Bench <span>'+bench.length+'</span></h2>';
  bench.forEach(p=> h += row(p, p.pos, 'bn'));
  // waiver / trades sub-tab switch, both anchored to the same league data
  h += '<div class="secttabs">'+[['waiver','Waiver'],['trades','Trades']].map(([v,lab])=>
        '<button data-st="'+v+'" class="'+(v===S.wtab?'on':'')+'">'+lab+'</button>').join('')+'</div>';
  if(S.wtab === 'trades'){
    h += tradesHtml();
  } else {
    h += '<div class="tabs">'+['RB','WR','TE','QB','DEF','K'].map(p=>
          '<button data-w="'+p+'" class="'+(p===S.wpos?'on':'')+'">'+p+'</button>').join('')+'</div>';
    const wlist = fa.filter(p=>p.pos===S.wpos).slice(0,10);
    if(!wlist.length) h += '<div class="slot"><div class="tab bn">'+S.wpos+'</div><div class="who">'+
         '<div class="nm">Nobody available</div><div class="meta">Every projected '+S.wpos+' is rostered</div></div></div>';
    wlist.forEach(p=>{
      const up = worstStarter[p.pos]!=null && p.ros > worstStarter[p.pos];
      h += row(p, p.pos, 'bn', up?'<span class="good">beats your '+p.pos+' starter</span>':'');
    });
  }
  h += '<div class="tot"><span>Your starters</span><span>proj '+fmt(cTot)+
       ' · <b>'+(S.liveOn?'live '+fmt(liveTot):'live —')+'</b></span></div>';
  h += '<h2>Ask Claude about this team</h2>'+
       '<div class="chat"><div class="bub a" style="margin:0 0 10px">'+
       'Copy the snapshot below, paste it into a chat, and ask whatever you want. '+
       'It contains your lineup, bench, free agents, FAAB and this week’s live scores — everything this page computed.</div>'+
       '<div class="chips">'+
         ['Who is my riskiest start this week?','Which bench player is worth stashing?','Explain the FLEX call','Should I trade for a WR1?'].map(q=>'<button data-copyq="'+esc(q)+'">'+esc(q)+'</button>').join('')+
       '</div><button id="copy">Copy team snapshot</button> <span id="copied" class="meta"></span></div>';
  $('#out').innerHTML = h;
  const line = p => p.name+' ('+p.pos+', '+p.team+(p.inj?', '+p.inj:'')+') wk '+fmt(p.pts)+' / ros '+fmt(p.ros)+
                    (S.liveOn && p.live!=null ? ' / live '+fmt(p.live) : '');
  S.ctx = {
    league: S.league.name, week: S.week, season: S.season,
    scoring: 'rec='+(sc.rec??0)+', pass_td='+(sc.pass_td??0)+', no kicker slot: '+(!slots.includes('K')),
    slots, faab_left: left, faab_total: budget,
    live_total: S.liveOn ? fmt(liveTot) : null,
    optimal: best.filter(Boolean).map(line),
    currently_started: curP.map(line),
    bench: bench.map(line),
    top_free_agents: fa.slice(0,20).map(line)
  };
  $('#out').querySelectorAll('[data-st]').forEach(b=> b.onclick = ()=>{ S.wtab=b.dataset.st; kvSet('cfg', cfgObj()); render(); });
  $('#out').querySelectorAll('[data-w]').forEach(b=> b.onclick = ()=>{ S.wpos=b.dataset.w; render(); });
  $('#out').querySelectorAll('[data-id]').forEach(el=> el.onclick = ()=> showPlayer(el.dataset.id));
  $('#copy').onclick = ()=> copySnap('');
  $('#out').querySelectorAll('[data-copyq]').forEach(b=> b.onclick = ()=> copySnap(b.dataset.copyq));
  $('#foot').innerHTML =
    'Two numbers per player: the big neon figure is this week’s live/actual score from Sleeper, '+
    'the small line under it is the projection scored to this league. Recommendations still run off '+
    'projections. Team defenses use Sleeper’s PPR total. Player list refreshes daily; scores and '+
    'projections refresh every load.';
}

// ---- Suggested trades (rest-of-season value, all client-side) ----
// Rest-of-season value with the same weekly-projection fallback the add/drop logic uses.
const valROS = p => p.ros > 0 ? p.ros : (p.pts||0)*17;

// Score a roster by the total rest-of-season value of the best lineup it can field.
function lineupVal(recs, slots){
  const pool = recs.slice().sort((a,b)=>valROS(b)-valROS(a));
  return bestLineup(slots, pool).reduce((t,p)=>t+(p?valROS(p):0),0);
}

// Find fair 1-for-1 trades across the league that improve my starting lineup.
function computeTrades(){
  const slots = (S.league.roster_positions||[]).filter(p=>!['BN','IR','TAXI'].includes(p));
  const mine = S.rosters.find(r=>r.roster_id === +S.rosterId);
  if(!mine) return [];
  const myRecs = (mine.players||[]).map(mk);
  const myVal  = lineupVal(myRecs, slots);
  const cand = [];
  S.rosters.forEach(opp=>{
    if(opp.roster_id === +S.rosterId) return;
    const oppRecs = (opp.players||[]).map(mk);
    const oppVal  = lineupVal(oppRecs, slots);
    myRecs.forEach(give=>{
      oppRecs.forEach(get=>{
        const gv = valROS(give), tv = valROS(get);
        if(gv <= 0 || tv <= 0) return;
        // only pitch roughly balanced value so the other manager might say yes
        const ratio = gv / tv;
        if(ratio < 0.7 || ratio > 1.45) return;
        // re-field both lineups after the swap and require it helps both sides
        const myGain  = lineupVal(myRecs.filter(p=>p.id!==give.id).concat(get), slots) - myVal;
        if(myGain < 5) return;
        const oppGain = lineupVal(oppRecs.filter(p=>p.id!==get.id).concat(give), slots) - oppVal;
        if(oppGain <= 0) return;
        cand.push({opp, give, get, myGain, oppGain});
      });
    });
  });
  cand.sort((a,b)=> b.myGain - a.myGain);
  // spread suggestions: at most 2 per opponent, 6 total, no duplicate give>get pair
  const seen = new Set(), perOpp = {}, res = [];
  for(const t of cand){
    const k = t.give.id+'>'+t.get.id;
    if(seen.has(k)) continue; seen.add(k);
    perOpp[t.opp.roster_id] = perOpp[t.opp.roster_id] || 0;
    if(perOpp[t.opp.roster_id] >= 2) continue;
    perOpp[t.opp.roster_id]++;
    res.push(t);
    if(res.length >= 6) break;
  }
  return res;
}

function tradesHtml(){
  const list = computeTrades();
  let h = '';
  if(!list.length){
    return '<div class="slot"><div class="tab">—</div><div class="who">'+
      '<div class="nm">No clear trade upgrades</div>'+
      '<div class="meta">No fair 1-for-1 across the league improves your starting lineup right now</div></div></div>';
  }
  const nm = p => '<span class="tap" data-id="'+p.id+'">'+esc(p.name)+'</span>';
  list.forEach(t=>{
    h += '<div class="move"><span class="bid">+'+fmt(t.myGain)+'</span>'+
         '<b>GET</b> '+nm(t.get)+' ('+t.get.pos+' · '+t.get.team+')<br>'+
         '<b>GIVE</b> '+nm(t.give)+' ('+t.give.pos+' · '+t.give.team+')'+
         '<span class="why">from '+esc(teamName(t.opp.roster_id))+' · adds '+fmt(t.myGain)+
         ' ros to your starters · they gain '+fmt(t.oppGain)+' (fair enough to pitch)</span></div>';
  });
  h += '<div class="note" style="margin-top:10px">Trades weigh rest-of-season projections and re-run '+
       'both lineups after the swap. “They gain” is why the other manager might say yes. '+
       'One-for-one only — sanity-check byes and injuries before offering.</div>';
  return h;
}

function ptCell(p){

function row(p, tabTxt, cls, extra){
  if(!p) return '<div class="slot"><div class="tab '+(cls||'')+'">'+tabTxt+'</div>'+
    '<div class="who"><div class="nm">—</div><div class="meta">no eligible player</div></div>'+
    '<div class="pt"><span class="live dim">—</span></div></div>';
  return '<div class="slot tap" data-id="'+p.id+'"><div class="tab '+(cls||'')+'">'+tabTxt+'</div>'+
    '<div class="who"><div class="nm">'+esc(p.name)+'</div><div class="meta">'+p.pos+' · '+p.team+
    (p.inj?' · <span class="inj">'+esc(p.inj)+'</span>':'')+(extra?' · '+extra:'')+'</div></div>'+
    ptCell(p)+'</div>';
}

// ---- Matchup view (head-to-head vs this week's opponent) ----
function emptyState(t,b){ return '<div class="empty"><b>'+esc(t)+'</b><span>'+esc(b)+'</span></div>'; }

function matchupSide(entry, slots){
  if(!entry) return null;
  const starters = entry.starters || [];
  const players = slots.map((s,i)=>{ const id=starters[i]; return (id && id!=='0') ? mk(id) : null; });
  const proj = players.reduce((t,p)=>t+(p?p.pts:0),0);
  const live = entry.points != null ? entry.points
             : starters.reduce((t,id)=> t + ((S.live&&S.live[id])||0), 0);
  return { entry, players, proj, live };
}

function vcell(p, side){
  if(!p) return '<div class="vsp '+side+' empty">empty</div>';
  const hasLive = S.liveOn && S.live[p.id] != null;
  const info = '<div class="vinfo"><div class="vnm">'+esc(p.name)+
               (p.inj?' <span class="inj">'+esc(p.inj)+'</span>':'')+'</div>'+
               '<div class="vmeta">'+p.pos+' · '+p.team+' · proj '+fmt(p.pts)+'</div></div>';
  const pts = '<div class="vpts">'+(hasLive?fmt(S.live[p.id]):'—')+'</div>';
  return '<div class="vsp '+side+' tap" data-id="'+p.id+'">'+
         (side==='l' ? info+pts : pts+info)+'</div>';
}

function renderMatchup(){
  if(!S.matchups || !S.matchups.length){
    $('#out').innerHTML = emptyState('No matchup posted yet',
      'Sleeper posts matchups once the week is live. Reload during your game week to see the head-to-head.');
    S.ctx = null; $('#foot').innerHTML=''; return;
  }
  const mine = S.matchups.find(m=>m.roster_id === +S.rosterId);
  if(!mine){
    $('#out').innerHTML = emptyState('Team not found in matchups','Pick your team in League setup, then reload.');
    $('#foot').innerHTML=''; return;
  }
  const opp = mine.matchup_id != null
    ? S.matchups.find(m=> m.matchup_id === mine.matchup_id && m.roster_id !== mine.roster_id)
    : null;
  const slots = (S.league.roster_positions||[]).filter(p=>!['BN','IR','TAXI'].includes(p));
  const A = matchupSide(mine, slots), B = matchupSide(opp, slots);

  let h = '<div class="vhead">'+
    '<div class="vteam"><div class="vname">'+esc(teamName(mine.roster_id))+'</div>'+
      '<div class="vscore">'+(S.liveOn?fmt(A.live):'—')+'</div>'+
      '<div class="vproj">proj '+fmt(A.proj)+'</div></div>'+
    '<div class="vmid">VS</div>'+
    '<div class="vteam right"><div class="vname">'+(opp?esc(teamName(opp.roster_id)):'—')+'</div>'+
      '<div class="vscore">'+(opp&&S.liveOn?fmt(B.live):'—')+'</div>'+
      '<div class="vproj">'+(opp?'proj '+fmt(B.proj):'no opponent / bye')+'</div></div>'+
    '</div>';

  if(opp){
    const dl = A.live - B.live, pdl = A.proj - B.proj;
    const marginTxt = !S.liveOn ? 'projected margin '+(pdl>=0?'+':'')+fmt(pdl)
      : (dl===0 ? 'Tied · proj '+(pdl>=0?'+':'')+fmt(pdl)
        : (dl>0 ? 'Leading by '+fmt(Math.abs(dl)) : 'Trailing by '+fmt(Math.abs(dl)))
          +' · proj '+(pdl>=0?'+':'')+fmt(pdl));
    h += '<div class="vmargin '+(S.liveOn?(dl>0?'up':dl<0?'down':''):'')+'">'+marginTxt+'</div>';
  }

  h += '<div class="vs">';
  slots.forEach((s,i)=>{
    const a = A.players[i], b = opp ? B.players[i] : null;
    h += '<div class="vsrow'+(i===0?' first':'')+'">'+
         vcell(a,'l')+'<div class="vslot">'+slabel(s)+'</div>'+
         (opp ? vcell(b,'r') : '<div class="vsp r empty">—</div>')+'</div>';
  });
  h += '</div>';
  h += '<div class="tot"><span>proj '+fmt(A.proj)+'</span><span>PROJECTED FINAL</span>'+
       '<span>'+(opp?'proj '+fmt(B.proj):'—')+'</span></div>';

  $('#out').innerHTML = h;
  $('#out').querySelectorAll('[data-id]').forEach(el=> el.onclick = ()=> showPlayer(el.dataset.id));
  $('#foot').innerHTML =
    'Big neon number is the live/actual score from Sleeper (updates as games are played); the small line '+
    'is each player’s projection scored to this league. Only starters are shown — switch to Call Sheet '+
    'for bench, add/drops and the waiver board.';
}

function showPlayer(id){
  const m = S.players[id]; if(!m) return;
  const sc = S.league.scoring_settings;
  const w = S.proj[id]||{}, r = S.ros[id]||{};
  const rows = Object.keys(LAB).filter(k=>w[k]!=null||r[k]!=null).map(k=>
    '<div><span>'+LAB[k]+'</span><b>'+(w[k]!=null?fmt(w[k]):'—')+
    (r[k]!=null?' / '+fmt(r[k]):'')+'</b></div>').join('');

               m.y!=null?(m.y===0?'rookie':m.y+' yr exp'):'',
               m.d?'depth '+m.d:''].filter(Boolean).join(' · ');

    ? '<div><span>Live this week</span><b>'+fmt(S.live[id])+' pts</b></div>' : '';

        (m.i?'<div class="meta inj" style="margin-top:3px">'+esc(m.i)+(m.no?' — '+esc(m.no):'')+'</div>':'')+
        '</div><button class="ghost" id="x">Close</button></div>'+
      '<div class="statgrid">'+liveRow+
        '<div><span>Week '+S.week+' proj</span><b>'+fmt(score(w,m.p,sc))+' pts</b></div>'+
        '<div><span>Rest of season</span><b>'+fmt(score(r,m.p,sc))+' pts</b></div>'+rows+'</div>'+
      '<div class="note" style="margin:0;padding:12px 14px;border-top:0">Stat rows show two numbers: '+
      'this week / full season, both Sleeper projections scored to your league. The live figure at top '+
      'is the actual score posted so far.</div>'+
    '</div></div>';
  $('#x').onclick = closeM; $('#veil').onclick = e => { if(e.target.id==='veil') closeM(); };

const closeM = () => $('#modal').innerHTML='';

function snapText(q){
  const c = S.ctx, L = a => a.map(x=>'  - '+x).join('\n');
  return (q? q+'\n\n' : '')+
    'My fantasy team, week '+c.week+' of '+c.season+' ('+c.league+').\n'+
    'Scoring: '+c.scoring+'. Starting slots: '+c.slots.join(', ')+'.\n'+
    'FAAB: $'+c.faab_left+' left of $'+c.faab_total+'.\n'+
    (c.live_total!=null ? 'My starters’ live score so far this week: '+c.live_total+'.\n' : '')+
    'Numbers per player are Sleeper values scored to my league: week proj / rest-of-season'+
    (c.live_total!=null?' / live actual':'')+'.\n\n'+
    'OPTIMAL LINEUP\n'+L(c.optimal)+'\n\n'+
    'CURRENTLY STARTED\n'+L(c.currently_started)+'\n\n'+
    'BENCH\n'+L(c.bench)+'\n\n'+
    'TOP FREE AGENTS\n'+L(c.top_free_agents);
}
async function copySnap(q){
  if(!S.ctx){ flash('Load the Call Sheet first'); return; }
  const t = snapText(q);
  try{ await navigator.clipboard.writeText(t); flash('Copied — paste it into a chat'); }
  catch(e){
    const ta = document.createElement('textarea');
    ta.value = t; ta.style.cssText='position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); flash('Copied — paste it into a chat'); }
    catch(_){ flash('Copy blocked — select the text manually'); }
    ta.remove();
  }
}
function flash(m){
  const el = $('#copied'); if(!el) return;
  el.textContent = ' '+m;
  setTimeout(()=>{ if($('#copied')) $('#copied').textContent=''; }, 3000);
}

function err(t,b){ $('#msg').innerHTML='<div class="err"><b>'+t+'</b>'+b+'</div>'; $('#out').innerHTML=''; }
function fail(e){
  const blocked = /Failed to fetch|NetworkError|Load failed/i.test(e.message);
  if(blocked && !S.proxy) err('Proxy is empty','Sleeper does not let browsers read its API directly. Paste your Worker URL — it must end with <code>/?url=</code>.');
  else if(blocked) err('Could not reach the proxy','The Worker did not respond. Check it is deployed and that the URL ends with <code>/?url=</code>.');
  else err('Could not load', esc(e.message)+'<br><br>403 = Worker allowlist missing a host. 404 = bad league ID. 429 = too many calls, wait a minute.');
}

$('#go').onclick = run;
$('#team').onchange = e => { S.rosterId=+e.target.value; kvSet('cfg', cfgObj()); render(); };
$('#clear').onclick = async () => { await kvDel('players'); err('Cache cleared','Player list will be pulled fresh on the next load.'); };

(async ()=>{
  const c = await kvGet('cfg');
  if(c){ if(c.lid) $('#lid').value=c.lid; if(c.proxy) $('#proxy').value=c.proxy;
         S.rosterId=c.rosterId; if(c.view) S.view=c.view; if(c.wtab) S.wtab=c.wtab; }
  if($('#lid').value.trim()) run(); else $('#cfgbox').open = true;
})();
</script>
